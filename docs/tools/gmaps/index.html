<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Google 地圖更新進度｜大日開發</title>
<link rel="icon" href="../../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* VOICE  內部工作表：直接、清楚，一眼看出哪幾場還沒改
   IDEA   像場站巡檢單：每一場一列，沒過的項目用橘色章蓋上
   PICTURE 上方三條進度條就是主圖（名稱／網站／全部完成）
   COLOUR 官網藍為主、橘色＝待處理、綠色＝完成，白底
   LAYOUT 標題與按鈕在上，進度條，依公司分組的清單；手機一欄 */
:root{--blue:#2561a9;--blue-d:#1b4a83;--orange:#e0662a;--orange-bg:#fdebe0;--green:#2f8f5b;--green-bg:#e3f3ea;--ink:#1d1f22;--ink2:#5b6068;--line:#e2e6ec;--bg:#fff;--surface:#f3f5f8}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:clamp(20px,4vw,40px) max(4vw,16px) 64px}
h1{font-size:clamp(26px,4vw,36px);line-height:1.15;font-weight:900;margin:0}
.lead{color:var(--ink2);margin:8px 0 0;max-width:46em}
.asof{margin:14px 0 0;font-size:14px;color:var(--ink2);background:var(--surface);border-radius:10px;padding:10px 14px}
.asof b{color:var(--ink)}
.f button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0 8px}
.meter{background:var(--surface);border-radius:14px;padding:14px 16px}
.meter b{display:block;font:800 clamp(24px,3.4vw,32px)/1.1 "Inter Tight",sans-serif;font-variant-numeric:tabular-nums}
.meter span{font-size:14px;color:var(--ink2)}
.track{height:8px;border-radius:99px;background:#dde3ea;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s ease}
.f{display:flex;gap:6px;flex-wrap:wrap;margin:26px 0 4px}
.f button{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:40px;padding:0 16px;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;color:var(--ink)}
.f button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
h2{font-size:18px;margin:26px 0 8px;font-weight:800}
h2 small{font-weight:500;color:var(--ink2);font-size:14px;margin-left:6px}
ul.rows{list-style:none;margin:0;padding:0}
.row,.head{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr) 220px;gap:6px 20px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line)}
.head{padding:8px 4px;font-size:13px;font-weight:700;color:var(--ink2);border-bottom:1px solid var(--line)}
.row.todo{background:linear-gradient(90deg,rgba(224,102,42,.06),transparent 60%)}
.gname{font-weight:700;color:var(--ink);text-decoration:none}
.gname:hover{color:var(--blue);text-decoration:underline}
.ours{display:block;font-size:13px;color:var(--ink2)}
.web{font-size:14px;overflow-wrap:anywhere;color:var(--ink2)}
.web a{color:var(--blue)}
.web .none{color:#9aa1ab}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start}
.tag{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.tag.bad{background:var(--orange-bg);color:#a8461a}
.tag.ok{background:var(--green-bg);color:#22704a}
.tag.mid{background:#fff4d6;color:#7a5a00}
.tag.wait{background:var(--surface);color:var(--ink2)}
.tag.err,.tag.redo{background:#fbe3e3;color:#a12a2a}
.tag.pend{background:#fff4d6;color:#7a5a00}
.tag.none{background:var(--orange-bg);color:#a8461a}
.st{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.3}
.st+.st{margin-top:6px}
.st .k{color:var(--ink2);width:2.2em;flex:none}
.st .d{color:#8a919b;font-size:12px;white-space:nowrap}
.tags{flex-direction:column;align-items:stretch}
.row.redo{background:linear-gradient(90deg,rgba(161,42,42,.06),transparent 60%)}
.row.todo.pend{background:linear-gradient(90deg,rgba(222,170,30,.07),transparent 60%)}
.note{display:block;font-size:12.5px;color:#a8461a;margin-top:2px}
.empty{padding:18px 4px;color:var(--ink2)}
.foot{margin-top:28px;font-size:13px;color:var(--ink2)}
@media(max-width:700px){
  .meters{gap:8px}
  .meter{padding:10px 12px}
  .meter b{font-size:22px}
  .meter span{font-size:12.5px}
  .row{grid-template-columns:1fr}
  .head{display:none}
}
@media(prefers-reduced-motion:reduce){.track i{transition:none}}
</style>
</head>

台北市石牌國小地下停車場 北投區"},{"code":"tongxing","name":"同興平面停車場","company":"千斗開發","soon":false,"cid":"8145203771837348925","dup":"","gname":"千斗-同興平面停車場","web":"https://www.majortek.com.tw/","edits":{"web":{"status":"待處理","date":"11月24日"}},"expected":"https://www.dari.com.tw/parking.html?s=tongxing","query":"千斗-同興平面停車場 泰山區"},{"code":"tw64","name":"台64橋下平面停車場","company":"千斗開發","soon":false,"cid":"7255230686408751456","dup":"","gname":"千斗-台64橋下平面停車場","web":"https://www.majortek.com.tw/","edits":{"web":{"status":"待處理","date":"11月24日"}},"expected":"https://www.dari.com.tw/parking.html?s=tw64","query":"千斗-台64橋下平面停車場 五股區"},{"code":"shuidui","name":"水碓三路平面停車場","company":"千斗開發","soon":false,"cid":"4677177246222186538","dup":"","gname":"千斗-水碓三路平面停車場","web":"","edits":{"web":{"status":"待處理","date":"11月24日"}},"expected":"https://www.dari.com.tw/parking.html?s=shuidui","query":"千斗-水碓三路平面停車場 五股區"},{"code":"xinwu","name":"新五平面停車場","company":"千斗開發","soon":false,"cid":"8894223948509403547","dup":"","gname":"千斗-新北市五股區新五平面停車場","web":"","edits":{"web":{"status":"待處理","date":"11月24日"}},"expected":"https://www.dari.com.tw/parking.html?s=xinwu","query":"千斗-新北市五股區新五平面停車場 五股區"},{"code":"hean","name":"合安路停車場","company":"千斗開發","soon":false,"cid":"3391088400906895363","dup":"","gname":"千斗-新北市板橋區合安路停車場","web":"","edits":{"web":{"status":"待處理","date":"11月24日"}},"expected":"https://www.dari.com.tw/parking.html?s=hean","query":"千斗-新北市板橋區合安路停車場 板橋區"},{"code":"nanlin","name":"南林段平面停車場","company":"千斗開發","soon":true,"cid":"2238085954597809661","dup":"","gname":"Times 泰山南林段平面停車場","web":"","edits":{},"expected":"https://www.dari.com.tw/parking.html?s=nanlin","query":"Times 泰山南林段平面停車場 泰山區"},{"code":"yixue","name":"義學立體停車場","company":"千斗開發","soon":true,"cid":"8512459115602307485","dup":"2094695247881122279","gname":"泰山區義學立體停車場","web":"","edits":{},"expected":"https://www.dari.com.tw/parking.html?s=yixue","query":"泰山區義學立體停車場 泰山區"}]};
const LOTS = D.lots;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const fmt = t => { const d = new Date(t); return isNaN(d) ? '' : d.toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }); };
const shortDate = s => String(s || '').replace(/^(\d{4})年(\d+)月(\d+)日$/, '$1/$2/$3').replace(/^(\d+)月(\d+)日$/, '$1/$2');

const prefixOf = l => l.company === '千斗開發' ? '千斗' : '大日';
const normU = u => String(u || '').trim().replace(/^http:\/\//i, 'https://').replace(/\/+$/, '').toLowerCase();
const meets = (l, k) => k === 'name' ? String(l.gname || '').startsWith(prefixOf(l)) : (!!l.web && normU(l.web) === normU(l.expected));

/* 每個欄位的狀態：待處理＞已完成（地圖上已符合）＞未接受＞已接受＞未申請 */
function field(l, k) {
  const e = (l.edits || {})[k];
  if (e && e.status === '待處理') return { c: 'pend', t: '待處理', d: e.date };
  if (meets(l, k)) return { c: 'ok', t: '已完成', d: e && e.status === '已接受' ? e.date : '' };
  if (e && e.status === '未接受') return { c: 'redo', t: '未接受', d: e.date };
  if (e && e.status === '已接受') return { c: 'ok', t: '已接受', d: e.date };
  return { c: 'none', t: '未申請', d: '' };
}
function cat(l) {
  if (l.soon) return 'soon';
  const f = [field(l, 'name'), field(l, 'web')].map(x => x.c);
  if (f.includes('redo')) return 'redo';
  if (f.includes('none')) return 'none';
  if (f.includes('pend')) return 'pend';
  return 'done';
}
const active = LOTS.filter(l => !l.soon);
const CATS = [['all', '全部'], ['redo', '需重新申請'], ['none', '未申請'], ['pend', '處理中'], ['done', '已完成']];
let filter = 'all';

function meters() {
  const n = active.length;
  const nameOK = active.filter(l => field(l, 'name').c === 'ok').length;
  const webOK = active.filter(l => field(l, 'web').c === 'ok').length;
  const redo = active.filter(l => cat(l) === 'redo').length;
  const m = [['名稱已完成', nameOK, n, 'var(--green)'], ['網站已完成', webOK, n, 'var(--green)'], ['需重新申請', redo, n, '#c2413b']];
  $('meters').innerHTML = m.map(([t, v, all, col]) => `<div class="meter"><b>${v}<span style="font-size:.55em;color:var(--ink2)"> / ${all}</span></b><span>${t}</span><div class="track"><i style="width:${all ? Math.round(v / all * 100) : 0}%;background:${col}"></i></div></div>`).join('');
}
function filters() {
  $('filters').innerHTML = CATS.map(([k, t]) => { const c = k === 'all' ? active.length : active.filter(l => cat(l) === k).length; return `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${t}（${c}）</button>`; }).join('');
  $('filters').querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { filter = b.dataset.f; render(); }));
}
function stLine(label, f) {
  return `<div class="st"><span class="k">${label}</span><span class="tag ${f.c}">${esc(f.t)}</span>${f.d ? `<span class="d">${esc(shortDate(f.d))} 申請</span>` : ''}</div>`;
}
function row(l) {
  const web = l.web ? `<a href="${esc(l.web)}" target="_blank" rel="noopener">${esc(l.web)}</a>` : '<span class="none">未填網站</span>';
  const note = l.dup ? `<span class="note">Google 地圖上有兩筆同名地點，<a href="https://maps.google.com/?cid=${esc(l.dup)}" target="_blank" rel="noopener">另一筆</a></span>` : '';
  const st = l.soon ? '<span class="tag wait">2027/03 接場，暫不處理</span>' : stLine('名稱', field(l, 'name')) + stLine('網站', field(l, 'web'));
  const c = cat(l);
  const cls = c === 'redo' ? ' todo redo' : c === 'pend' ? ' todo pend' : c === 'none' ? ' todo' : '';
  return `<li class="row${cls}"><div><a class="gname" href="https://maps.google.com/?cid=${esc(l.cid)}" target="_blank" rel="noopener">${esc(l.gname || '（讀不到名稱）')}</a><span class="ours">官網名稱：${esc(l.name)}</span>${note}</div><div class="web">${web}</div><div class="tags">${st}</div></li>`;
}
function render() {
  meters(); filters();
  const rank = { redo: 0, none: 1, pend: 2, done: 3, soon: 4 };
  const pick = l => filter === 'all' ? true : cat(l) === filter;
  const groups = [['大日開發', LOTS.filter(l => !l.soon && l.company === '大日開發')], ['千斗開發', LOTS.filter(l => !l.soon && l.company === '千斗開發')], ['即將接場', filter === 'all' ? LOTS.filter(l => l.soon) : []]];
  let html = '';
  for (const [t, ls] of groups) {
    const shown = ls.filter(pick).sort((a, b) => rank[cat(a)] - rank[cat(b)]);
    if (!shown.length) continue;
    html += `<h2>${t}<small>${shown.length} 場</small></h2><div class="head" aria-hidden="true"><span>場域名稱</span><span>目前網站</span><span>申請狀態</span></div><ul class="rows">${shown.map(row).join('')}</ul>`;
  }
  $('list').innerHTML = html || '<p class="empty">這個篩選目前沒有場站。</p>';
  $('asof').innerHTML = `Google 上的名稱與網站：<b>${esc(fmt(D.asOf))}</b> 讀取；申請狀態：<b>${esc(fmt(D.editsAsOf))}</b> 讀取 Google 地圖「你的貢獻＞編輯」。要更新，跟 Claude 說「更新 Google 地圖狀態」。`;
}
render();
}
</script>
